<script>
const KEY_USER='temukost_demo_user_v1',KEY_ORDERS='temukost_demo_orders_v1',KEY_SELECTED='temukost_selected_order_v1';
const packageData={name:'Layanan TemuKost',price:500000,subtitle:'Service fee tetap per pencarian'};
let screen='home',step=1,staffSelected=null,toastTimer;let draft={};
const $=s=>document.querySelector(s);const id=()=>('TK-'+Date.now().toString(36).slice(-5).toUpperCase());
function safeJSON(k,fallback){try{return JSON.parse(localStorage.getItem(k))||fallback}catch{return fallback}}
function user(){return safeJSON(KEY_USER,null)}function orders(){return safeJSON(KEY_ORDERS,[])}function saveOrders(v){localStorage.setItem(KEY_ORDERS,JSON.stringify(v))}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function notify(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function orderById(i){return orders().find(o=>o.id===i)}function myOrders(){let u=user();return u?orders().filter(o=>o.email===u.email).sort((a,b)=>b.created-a.created):[]}function activeOrder(){let all=myOrders(),wanted=localStorage.getItem(KEY_SELECTED);return all.find(o=>o.id===wanted)||all[0]||null}

function homeViewLegacy(){return `<div class="shell"><section class="hero"><div><span class="eyebrow"><i class="dot"></i>Teman cari kos, bukan listing biasa</span><h1>Temukan kos yang pas. <em>Kami bantu carikan.</em></h1><p class="hero-copy">Ceritakan kebutuhanmu sekali. Tim TemuKost mencarikan pilihan kos sesuai budget, fasilitas, dan lokasi—lalu bahas hasilnya langsung lewat chat.</p><div class="hero-actions"><button class="btn btn-primary" data-action="start">Mulai isi kebutuhan <span aria-hidden="true">→</span></button><button class="btn btn-outline" data-action="benefits">Lihat alur & benefit</button></div><div class="trust-line"><div class="avatars" aria-hidden="true"><span>R</span><span>A</span><span>D</span></div><span>Mulai dari kebutuhanmu, lanjut konsultasi dengan tim</span></div></div><div class="hero-art"><div class="hero-photo" role="img" aria-label="Interior kamar kos yang terang dan nyaman"></div><div class="visual-caption">PENCARIAN YANG LEBIH PERSONAL</div><div class="floating-card match-card"><span class="card-label">Contoh kecocokan</span><div class="match-number">4.8 <small>/ 5</small></div><span class="card-label">dari fasilitas & lokasi</span><div class="mini-bar"><i></i></div></div><div class="floating-card update-card"><span class="check-icon">✓</span><div><b>Update dari tim</b><small>Diskusi lanjut lewat chat akunmu</small></div></div></div></section></div><section class="section section-white" id="how"><div class="shell"><div class="section-head"><div><span class="eyebrow">Praktis dan jelas</span><h2>Dari kebutuhan jadi shortlist.</h2><p>Semua detail pesanan tersimpan di akunmu. Tidak perlu mengulang cerita dari awal.</p></div></div><div class="how-grid"><article class="how-card"><div class="step-num">01</div><h3>Ceritakan kriteria kos</h3><p>Isi area, budget, fasilitas yang wajib ada, jarak, dan catatan khususmu.</p></article><article class="how-card"><div class="step-num">02</div><h3>Pilih paket, bayar jasa</h3><p>Service fee satu kali dibayar di awal. Kalau ada kebutuhan tambahan berbayar, tim ajukan dulu untuk persetujuanmu.</p></article><article class="how-card"><div class="step-num">03</div><h3>Diskusi dengan tim</h3><p>Chat dibuka setelah pembayaran. Terima update dan bahas pilihan kos langsung dari akun.</p></article></div></div></section><section class="section" id="package"><div class="shell"><div class="section-head"><div><span class="eyebrow">Katalog jasa</span><h2>Satu paket. Kebutuhanmu yang menentukan.</h2><p>Harga berikut hanya angka contoh agar alur prototype bisa dicoba.</p></div><button class="btn btn-primary" data-action="start">Isi kebutuhan kos →</button></div><div class="package-wrap"><article class="package-card"><div class="package-top"><div><span class="pill">Paket utama</span><h3>${packageData.name}</h3><p class="muted">Bantu cari pilihan kos sesuai kriteria personalmu.</p></div><span class="pill orange">Contoh harga</span></div><div class="price">${money(packageData.price)} <small>/ sekali bayar</small></div><div class="price-note">Service fee jasa · nominal belum ditetapkan</div><ul class="feature-list"><li><span class="tick">✓</span> Pencarian berdasarkan kebutuhanmu</li><li><span class="tick">✓</span> Preferensi harga, fasilitas, dan jarak</li><li><span class="tick">✓</span> Konsultasi dan kabar via chat akun</li><li><span class="tick">✓</span> Riwayat pencarian tersimpan di akun</li></ul><button class="btn btn-primary btn-block" data-action="start">Pilih paket ini</button><div class="guarantee"><span class="shield">♧</span><span><b>Garansi pencarian.</b> Bila tim tidak menemukan opsi yang memenuhi kriteria yang sudah disepakati, service fee dikembalikan. Syarat final perlu ditetapkan sebelum layanan diluncurkan.</span></div></article><aside class="private-box"><span class="private-icon">⌑</span><span class="eyebrow">Kebutuhan khusus?</span><h3>Tambahan dibuat khusus untuk pesananmu.</h3><p>Tulis permintaan ekstra di formulir atau chat. Jika ada biaya tambahan, tim akan mengajukan penawaran dan invoice pribadi. Item itu hanya muncul di akunmu—bukan katalog publik—dan perlu persetujuan sebelum ditagihkan.</p><div class="callout"><b>Privat per akun.</b> Pesanan dan invoice tambahan terhubung ke akun pelanggan, bukan ke kredensial pembayaran.</div></aside></div></div></section></div>`}
function loginView(){return `<div class="shell page"><div class="login-wrap"><div class="panel"><div class="login-mark">⌂</div><span class="eyebrow" style="margin-top:17px">Akun TemuKost</span><h1 class="page-title" style="font-size:30px">Simpan pencarianmu.</h1><p class="page-sub">Masuk ke prototype untuk mengisi kebutuhan kos, mengikuti status, dan melanjutkan chat.</p><form id="login-form"><div class="field"><label for="full-name">Nama</label><input id="full-name" name="name" required placeholder="Nama kamu" autocomplete="name" value="${esc(user()?.name||'')}"></div><div class="field"><label for="email">Email</label><input id="email" name="email" required type="email" placeholder="nama@email.com" autocomplete="email" value="${esc(user()?.email||'')}"></div><button class="btn btn-primary btn-block" type="submit">Lanjutkan ke akun <span>→</span></button></form><p class="fineprint" style="margin:14px 0 0">Prototype ini tidak memakai password atau mengirim data ke server. Akun demo hanya tersimpan lokal di browser ini.</p><button class="link-btn" data-action="home" style="margin-top:13px">← Kembali ke beranda</button></div></div></div>`}
function step1(){return `<div class="form-step"><h2>Mulai dari lokasi & budget</h2><p>Area bisa ditulis fleksibel dulu—kota layanan belum dikunci.</p><div class="field"><label for="city">Kota atau area tujuan *</label><input id="city" name="city" required placeholder="Contoh: sekitar kampus / kantor"></div><div class="two-fields"><div class="field"><label for="budget">Budget kos per bulan *</label><select id="budget" name="budget" required><option value="">Pilih rentang</option><option>Di bawah Rp1 juta</option><option>Rp1–1,5 juta</option><option>Rp1,5–2 juta</option><option>Rp2–3 juta</option><option>Di atas Rp3 juta</option><option>Fleksibel, diskusikan</option></select></div><div class="field"><label for="movein">Rencana mulai tinggal</label><input id="movein" name="movein" type="date"></div></div><div class="form-actions"><button class="btn btn-outline" data-action="home" type="button">Batal</button><button class="btn btn-primary" type="submit">Lanjut: spesifikasi →</button></div></div>`}
function step2(){return `<div class="form-step"><h2>Seperti apa kos yang dicari?</h2><p>Pilih yang penting. Tim akan mengonfirmasi detail lainnya lewat chat.</p><div class="field"><label for="near">Dekat dengan apa?</label><input id="near" name="near" placeholder="Nama kampus, kantor, atau patokan"></div><div class="field"><label for="distance">Jarak maksimal yang diinginkan</label><select id="distance" name="distance"><option value="">Belum ada patokan</option><option>Maksimal 1 km</option><option>Maksimal 3 km</option><option>Maksimal 5 km</option><option>Bisa lebih jauh, yang penting aksesnya mudah</option></select></div><div class="field"><label>Fasilitas yang diutamakan</label><div class="chips">${['AC','Kamar mandi dalam','Wi-Fi','Kasur / furnished','Dapur bersama','Parkir motor','Laundry'].map(x=>`<label class="chip"><input type="checkbox" name="features" value="${x}"><span>${x}</span></label>`).join('')}</div></div><div class="field"><label for="gender">Preferensi lingkungan</label><select id="gender" name="gender"><option value="">Tidak ada preferensi khusus</option><option>Kos putra</option><option>Kos putri</option><option>Kos campur</option></select></div><div class="form-actions"><button class="btn btn-outline" data-action="prev" type="button">← Kembali</button><button class="btn btn-primary" type="submit">Lanjut: catatan →</button></div></div>`}
function step3(){return `<div class="form-step"><h2>Ada hal lain yang penting?</h2><p>Tulis catatan atau layanan bantuan tambahan yang ingin dibahas bersama tim.</p><div class="field"><label for="priority">Prioritas utama</label><select id="priority" name="priority"><option>Harga paling sesuai</option><option>Lokasi dekat tujuan</option><option>Fasilitas lengkap</option><option>Lingkungan nyaman dan aman</option><option>Belum tahu, ingin konsultasi</option></select></div><div class="field"><label for="notes">Catatan kebutuhan tambahan</label><textarea id="notes" name="notes" placeholder="Contoh: lebih suka kamar yang tidak di lantai dasar, butuh akses transportasi umum, waktu survei fleksibel..."></textarea><div class="field-help">Jangan tulis kata sandi atau informasi pembayaran di catatan.</div></div><div class="field"><label>Fasilitas bantuan yang ingin dibahas</label><div class="chips"><label class="chip"><input type="checkbox" name="serviceExtras" value="Video kos"><span>Video kos</span></label><label class="chip"><input type="checkbox" name="serviceExtras" value="Video call"><span>Video call (VC)</span></label><label class="chip"><input type="checkbox" name="serviceExtras" value="Share location"><span>Share loc</span></label></div><div class="field-help">Pilihan ini jadi permintaan. Tim mengonfirmasi ketersediaan, lokasi, dan jadwal lewat chat.</div></div><div class="field"><label class="checkbox-line"><input name="pickup" type="checkbox"><span>Saya ingin dibantu penjemputan saat mulai pindah ke kos. Titik jemput, area layanan, dan jadwal akan dikonfirmasi tim.</span></label></div><div class="field"><label for="pickup-point">Perkiraan titik jemput (opsional)</label><input id="pickup-point" name="pickupPoint" placeholder="Contoh: stasiun, terminal, atau alamat area"></div><div class="callout"><b>Semua bantuan tambahan dikonfirmasi dulu.</b> Tim akan membahas ketersediaan video, video call, share loc, dan penjemputan sesuai lokasi serta jadwal. Jika ada biaya khusus di luar layanan utama, kamu harus menyetujuinya sebelum ditagihkan.</div><div class="form-actions"><button class="btn btn-outline" data-action="prev" type="button">← Kembali</button><button class="btn btn-primary" type="submit">Lanjut konfirmasi layanan →</button></div></div>`}
function bookingView(){let forms=[step1,step2,step3];return `<div class="shell page"><div class="crumbs"><button data-action="home">Beranda</button> / Kebutuhan kos</div><span class="eyebrow">Form kebutuhan</span><h1 class="page-title">Biar kami tahu yang kamu cari.</h1><p class="page-sub">Langkah ${step} dari 3 · detail ini hanya untuk kebutuhan pencarianmu.</p><div class="form-layout"><section class="panel"><div class="progress">${[1,2,3].map(n=>`<span class="progress-seg ${n<=step?'active':''}"></span>`).join('')}<span class="progress-label">${step}/3</span></div><form id="booking-form">${forms[step-1]()}</form></section><aside class="side-note"><span class="pill">Privat untuk pesananmu</span><h3>Belum tahu detailnya? Tidak apa.</h3><p>Masukkan yang kamu tahu dulu. Tim bisa bantu memperjelas kriteria lewat chat setelah paket dibayar.</p><ul><li>Satu service fee flat untuk pencarian utama.</li><li>Permintaan ekstra berbayar perlu persetujuan.</li><li>Formulir tidak menjamin kos tersedia sampai waktu sewa.</li></ul></aside></div></div>`}
function packageView(){let d=draft;return `<div class="shell page"><div class="crumbs"><button data-action="form">← Ubah kebutuhan</button> / Konfirmasi layanan</div><span class="eyebrow">Layanan TemuKost</span><h1 class="page-title">Pencarian kos personal.</h1><p class="page-sub">Satu layanan utama untuk pencarian kosmu. Bukan katalog paket bertingkat.</p><div class="checkout-layout"><div class="panel"><div class="package-top"><div><span class="pill">Satu layanan · service fee tetap</span><h3 style="margin:10px 0 5px">Dari shortlist sampai siap pindah</h3><p class="muted">Nominal service fee tidak ditampilkan di halaman publik; konfirmasi layanan tetap dilakukan sebelum transaksi.</p></div></div><ul class="feature-list" style="margin-top:20px"><li><span class="tick">✓</span> Tim mencarikan berdasarkan kriteria yang kamu isi</li><li><span class="tick">✓</span> Update dan konsultasi melalui chat akun</li><li><span class="tick">✓</span> Contoh bantuan: video kos, video call, share lokasi</li><li><span class="tick">✓</span> Bisa bahas penjemputan saat akan pindah, sesuai area dan jadwal</li><li><span class="tick">✓</span> Invoice layanan tambahan memerlukan persetujuanmu</li></ul><div class="field"><label class="checkbox-line"><input id="terms-check" type="checkbox"><span>Saya memahami ini adalah jasa pencarian, bukan biaya sewa kos. Manfaat seperti video, VC, share lokasi, dan penjemputan perlu dikonfirmasi sesuai ketersediaan area dan jadwal. Garansi service fee mengikuti kriteria pencarian yang disepakati.</span></label></div><button class="btn btn-primary btn-block" data-action="checkout">Lanjut konfirmasi layanan →</button></div><aside class="panel"><span class="eyebrow">Ringkasan kebutuhan</span><div class="summary-row"><span>Area</span><b>${esc(d.city||'—')}</b></div><div class="summary-row"><span>Budget</span><b>${esc(d.budget||'—')}</b></div><div class="summary-row"><span>Fasilitas</span><b>${esc((d.features||[]).join(', ')||'Diskusikan')}</b></div><div class="summary-row"><span>Jarak</span><b>${esc(d.distance||'Fleksibel')}</b></div><div class="summary-row"><span>Perlu penjemputan?</span><b>${d.pickup?'Ya, dibahas':'Belum diminta'}</b></div><button class="link-btn" data-action="form">Ubah kriteria</button></aside></div></div>`}
function checkoutView(){return `<div class="shell page"><div class="crumbs"><button data-action="package">← Kembali</button> / Checkout simulasi</div><span class="eyebrow">Konfirmasi pesanan</span><h1 class="page-title">Periksa sebelum lanjut.</h1><p class="page-sub">Prototype ini tidak melakukan pembayaran sungguhan.</p><div class="checkout-layout"><section class="panel"><h3 style="font-size:18px">Konfirmasi layanan pencarian</h3><p class="muted">Service fee flat dicatat untuk pesanan ini. Rincian nominal tidak ditampilkan pada halaman publik.</p><div class="summary-row"><span>Layanan</span><b>Pencarian kos personal</b></div><div class="summary-row"><span>Sewa kos</span><b>Belum termasuk</b></div><div class="summary-row"><span>Video / VC / share lokasi</span><b>Dikonfirmasi tim</b></div><div class="summary-row"><span>Penjemputan</span><b>${draft.pickup?'Diminta · konfirmasi area/jadwal':'Tidak diminta'}</b></div><div class="notice">Prototype: ini bukan transaksi sungguhan. Service fee flat ditetapkan internal; layanan, ketersediaan penjemputan, serta ketentuan sebelum operasional perlu dikonfirmasi bersama pelanggan.</div><button class="btn btn-primary btn-block" data-action="pay">Konfirmasi layanan (simulasi)</button><p class="fineprint" style="margin:12px 0 0">Pembayaran asli, metode transaksi, dan ketentuan refund belum terhubung.</p></section><aside class="panel"><span class="eyebrow">Akun</span><p style="margin:8px 0 5px"><b>${esc(user()?.name||'')}</b></p><p class="muted">${esc(user()?.email||'')}</p><span class="eyebrow" style="margin-top:15px">Tujuan pencarian</span><p style="margin:7px 0 0;font-size:13px">${esc(draft.city||'')}<br>${esc(draft.budget||'')}</p></aside></div></div>`}
function statusLabel(s){return s||'Menunggu pembayaran'}function timeline(s){let states=['Menunggu pembayaran','Kriteria ditinjau','Pencarian berjalan','Pilihan dibagikan'];let i=s==='Menunggu pembayaran'?-1:s==='Kriteria ditinjau'?0:s==='Pencarian berjalan'?1:s==='Pilihan dibagikan'?2:3;return `<div class="timeline">${states.map((x,n)=>`<div class="timeline-step ${n<=i?'done':''}">${x}</div>`).join('')}</div>`}
function chatHtml(o,staff=false){let messages=o.messages||[];return `<div class="chat-box"><div class="chat-head"><div><b>Konsultasi pencarian</b><small>${staff?'mode panel tim':'Tim TemuKost · balas di jam layanan'}</small></div><span class="pill">${messages.length} pesan</span></div><div class="chat-messages" id="chat-messages">${messages.length?messages.map(m=>`<div class="bubble ${m.from==='customer'?'me':''}">${esc(m.text)}<small>${m.from==='customer'?'Kamu':'Tim TemuKost'} · ${new Date(m.at).toLocaleString('id-ID',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}</small></div>`).join(''):`<div class="bubble">Hai ${esc(o.customer.split(' ')[0])}, kami sudah menerima kebutuhan kosmu. Tim akan meninjau detailnya dan kabari kamu di sini.<small>Tim TemuKost · pesan otomatis simulasi</small></div>`}</div><form class="chat-send" data-chat-order="${esc(o.id)}"><input name="message" maxlength="500" required placeholder="Tulis pesan untuk tim…" aria-label="Pesan untuk tim"><button type="submit" aria-label="Kirim pesan">Kirim</button></form></div>`}
function invoicesHtml(o){let xs=o.invoices||[];return xs.length?`<div class="staff-section"><h3 style="font-size:15px;margin-bottom:9px">Invoice tambahan khusus</h3><p class="muted">Hanya terlihat di akun untuk pesanan ini.</p>${xs.map(x=>`<div class="invoice"><div class="invoice-top"><div><h4>${esc(x.title)}</h4><p>${esc(x.note||'Penawaran tambahan dari tim')}</p><p style="margin-top:5px">${esc(x.id)} · ${x.paid?'Lunas':x.approved?'Menunggu pembayaran':'Menunggu persetujuanmu'}</p></div><b>${money(x.amount)}</b></div>${!x.approved&&!x.paid?`<button class="btn btn-sm btn-outline" style="margin-top:11px" data-action="approve-invoice" data-order="${esc(o.id)}" data-id="${esc(x.id)}">Setujui penawaran</button>`:''}${x.approved&&!x.paid?`<button class="btn btn-sm btn-primary" style="margin-top:11px" data-action="pay-invoice" data-order="${esc(o.id)}" data-id="${esc(x.id)}">Simulasikan pembayaran</button>`:''}</div>`).join('')}</div>`:''}
function customerOrder(o){return `<article class="order-card"><div class="order-head"><div><h3>Pesanan ${esc(o.id)}</h3><div class="muted">Dibuat ${new Date(o.created).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})} · ${esc(o.package)}</div></div><span class="status-pill ${o.payment==='paid'?'':'pending'}">${o.payment==='paid'?statusLabel(o.status):'Menunggu pembayaran'}</span></div>${o.payment==='paid'?timeline(o.status):`<div class="notice">Service fee belum lunas. Chat konsultasi akan aktif setelah simulasi pembayaran.</div><button class="btn btn-primary btn-sm" data-action="resume-pay" data-id="${esc(o.id)}">Lanjutkan konfirmasi layanan</button>`}<div class="order-details" style="margin-top:14px"><div class="detail-box"><small>Area yang dicari</small><b>${esc(o.form.city||'—')}</b></div><div class="detail-box"><small>Budget per bulan</small><b>${esc(o.form.budget||'—')}</b></div><div class="detail-box"><small>Lokasi terdekat</small><b>${esc(o.form.near||'Belum ditentukan')}</b></div><div class="detail-box"><small>Preferensi fasilitas</small><b>${esc((o.form.features||[]).join(', ')||'Akan dibahas')}</b></div><div class="detail-box"><small>Bantuan yang diminta</small><b>${esc((o.form.serviceExtras||[]).join(', ')||'Dibahas bersama tim')}</b></div><div class="detail-box"><small>Penjemputan</small><b>${o.form.pickup?'Diminta · '+esc(o.form.pickupPoint||'titik dikonfirmasi'):'Belum diminta'}</b></div></div>${o.payment==='paid'?chatHtml(o):''}${invoicesHtml(o)}</article>`}
function accountView(){let u=user(),list=myOrders();return `<div class="shell page"><span class="eyebrow">Akun TemuKost</span><h1 class="page-title">Hai, ${esc(u?.name?.split(' ')[0]||'teman')}.</h1><p class="page-sub">Kriteria, update pencarian, dan invoice pribadi tersimpan di sini.</p><div class="account-layout"><aside class="panel"><div class="account-nav"><button class="active" data-action="account">Pesanan saya</button><button data-action="form">+ Pencarian baru</button><button data-action="logout">Keluar dari akun demo</button></div><div class="staff-section"><span class="eyebrow">Profil</span><p style="margin:9px 0 3px"><b>${esc(u?.name||'')}</b></p><p class="muted">${esc(u?.email||'')}</p><p class="fineprint">Demo lokal · data tersimpan di browser ini saja.</p></div></aside><section>${list.length?list.map(customerOrder).join(''):`<div class="empty"><span class="login-mark" style="margin:auto">⌕</span><h3>Belum ada pencarian kos.</h3><p>Isi kriteria, pilih paket, lalu ikuti pencarianmu dari akun ini.</p><button class="btn btn-primary" data-action="start">Buat pencarian pertama</button></div>`}</section></div></div>`}
function staffView(){let all=orders();if(!staffSelected||!all.some(o=>o.id===staffSelected))staffSelected=all[0]?.id||null;let o=all.find(x=>x.id===staffSelected);return `<div class="shell page"><span class="eyebrow">Mode demonstrasi · tim pencarian</span><h1 class="page-title">Panel pengelola.</h1><p class="page-sub">Prototype: daftar dan pembaruan hanya berjalan di browser yang sama.</p>${all.length?`<div class="staff-layout"><aside><div class="staff-list">${all.map(x=>`<button class="staff-order ${x.id===staffSelected?'active':''}" data-action="staff-select" data-id="${esc(x.id)}"><span class="staff-order-row"><b>${esc(x.customer)}</b><span class="pill">${x.payment==='paid'?'Aktif':'Belum bayar'}</span></span><small>${esc(x.id)} · ${esc(x.form.city||'Area belum diisi')}</small></button>`).join('')}</div></aside><section class="panel staff-panel"><div class="staff-order-row"><div><h3>${esc(o.customer)} · ${esc(o.id)}</h3><span class="muted">${esc(o.email)} · ${esc(o.form.city||'')}</span></div><span class="status-pill">${esc(statusLabel(o.status))}</span></div><div class="order-details" style="margin-top:15px"><div class="detail-box"><small>Budget</small><b>${esc(o.form.budget||'—')}</b></div><div class="detail-box"><small>Dekat / jarak</small><b>${esc(o.form.near||'—')} · ${esc(o.form.distance||'—')}</b></div><div class="detail-box"><small>Fasilitas</small><b>${esc((o.form.features||[]).join(', ')||'—')}</b></div><div class="detail-box"><small>Catatan</small><b>${esc(o.form.notes||'Tidak ada')}</b></div></div><div class="staff-section"><h4>Perbarui status pencarian</h4><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-outline btn-sm" data-action="status" data-status="Kriteria ditinjau">Kriteria ditinjau</button><button class="btn btn-outline btn-sm" data-action="status" data-status="Pencarian berjalan">Pencarian berjalan</button><button class="btn btn-outline btn-sm" data-action="status" data-status="Pilihan dibagikan">Pilihan dibagikan</button></div></div><div class="staff-section"><h4>Buat penawaran / invoice pribadi</h4><p class="muted">Item ini hanya masuk ke pesanan akun ini, bukan katalog. Wajib mendapat persetujuan pelanggan sebelum diterbitkan.</p><form id="invoice-form"><div class="field"><label>Nama tambahan</label><input name="title" required maxlength="80" placeholder="Contoh: bantuan survei lokasi"></div><div class="field"><label>Nominal tambahan (contoh)</label><input type="number" name="amount" required min="1000" max="10000000" placeholder="25000"></div><div class="field"><label>Catatan untuk pelanggan</label><input name="note" maxlength="140" placeholder="Tujuan atau cakupan biaya ini"></div><label class="checkbox-line"><input name="approved" type="checkbox" required><span>Pelanggan sudah menyetujui nominal dan cakupan melalui konsultasi.</span></label><button class="btn btn-primary btn-sm" style="margin-top:13px" type="submit">Terbitkan invoice khusus</button></form></div>${chatHtml(o,true)}</section></div>`:`<div class="empty"><h3>Belum ada pesanan di prototype.</h3><p>Buat akun demo, isi formulir, lalu simulasi pembayaran. Pesanan akan muncul di panel tim.</p><button class="btn btn-primary" data-action="start">Mulai alur demo</button></div>`}</div>`}
function homeViewFresh(){return `<div class="shell"><section class="hero"><div><span class="eyebrow"><i class="dot"></i>Cari kos, urusan sampai berangkat</span><h1>Kamu fokus pilih kos. <em>Biar kami bantu prosesnya.</em></h1><p class="hero-copy">Isi kriteria kos yang kamu butuhkan. Tim TemuKost bantu mencarikan pilihan, cek kondisi lewat video atau video call, bagikan lokasi, sampai mengatur penjemputan saat kamu mulai pindah.</p><div class="hero-actions"><button class="btn btn-primary" data-action="start">Mulai isi kebutuhan <span aria-hidden="true">→</span></button><button class="btn btn-outline" data-action="benefits">Lihat alur layanan</button></div><div class="trust-line"><span class="check-icon">✓</span><span>Satu service fee tetap untuk layanan pencarian kos</span></div></div><div class="hero-art"><div class="hero-photo" role="img" aria-label="Interior kamar kos yang terang dan nyaman"></div><div class="visual-caption">DARI CARI SAMPAI SIAP PINDAH</div><div class="floating-card match-card"><span class="card-label">Pengecekan jarak jauh</span><div class="match-number">Live <small>update</small></div><span class="card-label">Video, video call & share loc</span><div class="mini-bar"><i></i></div></div><div class="floating-card update-card"><span class="check-icon">✓</span><div><b>Berangkat ke kos baru</b><small>Penjemputan bisa dijadwalkan</small></div></div></div></section></div><section class="section section-white" id="how"><div class="shell"><div class="section-head"><div><span class="eyebrow">Alur layanan</span><h2>Dari kebutuhan sampai pindahan.</h2><p>Satu proses terhubung. Kriteria dan percakapan tetap tercatat di akunmu.</p></div></div><div class="how-grid"><article class="how-card"><div class="step-num">01</div><h3>Isi kebutuhan kos</h3><p>Tentukan area, batas budget, fasilitas, jarak, waktu pindah, dan catatan pentingmu.</p></article><article class="how-card"><div class="step-num">02</div><h3>Tim mulai mencarikan</h3><p>Setelah service fee tetap dibayarkan, tim berdiskusi denganmu dan menyusun opsi sesuai kriteria.</p></article><article class="how-card"><div class="step-num">03</div><h3>Cek kos dari mana saja</h3><p>Tinjau video kos, atur video call untuk melihat kondisi, dan terima share loc agar lokasinya mudah dicek.</p></article></div></div></section><section class="section" id="benefits"><div class="shell"><div class="section-head"><div><span class="eyebrow">Yang kamu dapat</span><h2>Bukan cuma kirim daftar kos.</h2><p>Teman pencarian dari shortlist sampai langkah pertama menempati kos.</p></div></div><div class="how-grid"><article class="how-card"><div class="step-num">▣</div><h3>Video kondisi kos</h3><p>Terima video ruangan dan fasilitas untuk membantu cek kondisi sebelum memutuskan.</p></article><article class="how-card"><div class="step-num">◉</div><h3>Video call langsung</h3><p>Jadwalkan VC bersama tim untuk melihat kamar secara live dan menanyakan detailnya.</p></article><article class="how-card"><div class="step-num">⌖</div><h3>Share loc & akses</h3><p>Terima titik lokasi kos, lalu cek jarak dan rute ke kampus, kantor, atau tujuanmu.</p></article><article class="how-card"><div class="step-num">↗</div><h3>Dijemput saat mulai pindah</h3><p>Setelah kos pilihanmu terkonfirmasi, tim bisa mengatur penjemputan sesuai area layanan dan jadwal yang disepakati.</p></article><article class="how-card"><div class="step-num">☏</div><h3>Konsultasi di akun</h3><p>Bahas preferensi dan terima update pencarian lewat chat yang tersambung dengan pesananmu.</p></article><article class="how-card"><div class="step-num">✓</div><h3>Garansi pencarian</h3><p>Jika tim tidak menemukan opsi yang memenuhi kriteria yang disepakati, service fee dikembalikan. Syarat final perlu disepakati sebelum layanan aktif.</p></article></div><div class="callout" style="margin-top:20px"><b>Service fee flat.</b> Nominal service fee diset tetap secara internal dan tidak ditampilkan pada halaman layanan ini. Pembayaran serta syarat layanan di prototype ini masih simulasi.</div><div style="margin-top:22px"><button class="btn btn-primary" data-action="start">Mulai cari kos bersama TemuKost →</button></div></div></section></div>`}
function render(){nav();let app=$('#app');app.innerHTML=screen==='home'?homeViewFresh():screen==='login'?loginView():screen==='form'?bookingView():screen==='package'?packageView():screen==='checkout'?checkoutView():screen==='account'?accountView():screen==='staff'?staffView():homeView();if(screen==='account'||screen==='staff'){let m=$('#chat-messages');if(m)m.scrollTop=m.scrollHeight}}
function go(s){screen=s;render();window.scrollTo({top:0,behavior:'smooth'})}
function ensureUser(next){if(!user()){sessionStorage.setItem('temukost_after_login',next);go('login')}else go(next)}
function collectStep(form){let d=new FormData(form);if(step===1){draft.city=d.get('city')?.trim()||'';draft.budget=d.get('budget')||'';draft.movein=d.get('movein')||''}if(step===2){draft.near=d.get('near')?.trim()||'';draft.distance=d.get('distance')||'';draft.features=d.getAll('features');draft.gender=d.get('gender')||''}if(step===3){draft.priority=d.get('priority')||'';draft.notes=d.get('notes')?.trim()||'';draft.serviceExtras=d.getAll('serviceExtras');draft.pickup=!!d.get('pickup');draft.pickupPoint=d.get('pickupPoint')?.trim()||''}}
function createOrder(){let u=user();let o={id:id(),email:u.email,customer:u.name,package:packageData.name,price:packageData.price,payment:'pending',status:'Menunggu pembayaran',created:Date.now(),form:JSON.parse(JSON.stringify(draft)),messages:[],invoices:[]};let all=orders();all.unshift(o);saveOrders(all);localStorage.setItem(KEY_SELECTED,o.id);staffSelected=o.id;return o}
function updateOrder(id,fn){let all=orders(),idx=all.findIndex(x=>x.id===id);if(idx<0)return;fn(all[idx]);saveOrders(all)}
function sendChat(form){let id=form.dataset.chatOrder,text=new FormData(form).get('message')?.trim();if(!text)return;let o=orderById(id);if(!o)return;updateOrder(id,x=>x.messages.push({from:screen==='staff'?'team':'customer',text,at:Date.now()}));render();let input=$('.chat-send input');if(input)input.focus()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='home')go('home');else if(a==='login')go('login');else if(a==='start')ensureUser('form');else if(a==='form')ensureUser('form');else if(a==='package')go('package');else if(a==='how'){go('home');setTimeout(()=>document.querySelector('#how')?.scrollIntoView({behavior:'smooth'}),40)}else if(a==='benefits'){go('home');setTimeout(()=>document.querySelector('#benefits')?.scrollIntoView({behavior:'smooth'}),40)}else if(a==='account')user()?go('account'):go('login');else if(a==='logout'){localStorage.removeItem(KEY_USER);notify('Keluar dari akun demo.');go('home')}else if(a==='prev'){if(step>1){step--;render()}}else if(a==='checkout'){if(!$('#terms-check')?.checked){notify('Centang konfirmasi sebelum lanjut.');return}go('checkout')}else if(a==='pay'){let o=createOrder();updateOrder(o.id,x=>{x.payment='paid';x.status='Kriteria ditinjau';x.messages.push({from:'team',text:`Halo ${x.customer.split(' ')[0]}! Service fee simulasi sudah tercatat. Tim sedang meninjau kriteria pencarian kosmu. Kamu bisa lanjut konsultasi di sini.`,at:Date.now()})});go('account');notify('Pembayaran simulasi berhasil. Chat sudah aktif.')}else if(a==='resume-pay'){let o=orderById(b.dataset.id);if(o){localStorage.setItem(KEY_SELECTED,o.id);draft=o.form||{};go('checkout')}}else if(a==='staff'){if(!user()){sessionStorage.setItem('temukost_after_login','staff');go('login')}else go('staff')}else if(a==='staff-select'){staffSelected=b.dataset.id;render()}else if(a==='status'){let o=orderById(staffSelected);if(o){let status=b.dataset.status;updateOrder(o.id,x=>{x.status=status;x.messages.push({from:'team',text:`Update pencarian: status berubah menjadi “${status}”. Kami akan terus mengabarimu di chat ini.`,at:Date.now()})});render();notify('Status dan update pelanggan diperbarui.')} }else if(a==='orders'){user()?go('account'):go('login')}else if(a==='approve-invoice'){let oid=b.dataset.order,invoiceId=b.dataset.id;if(!oid)return;let invoice=orderById(oid)?.invoices?.find(x=>x.id===invoiceId);if(!invoice||invoice.paid){notify('Penawaran tidak dapat diubah.');return}updateOrder(oid,x=>{let inv=x.invoices.find(y=>y.id===invoiceId);inv.approved=true;x.messages.push({from:'customer',text:`Saya menyetujui penawaran “${inv.title}” senilai ${money(inv.amount)}.`,at:Date.now()})});render();notify('Penawaran disetujui. Invoice simulasi siap dibayar.')}else if(a==='pay-invoice'){let oid=b.dataset.order,invoiceId=b.dataset.id;if(!oid)return;let invoice=orderById(oid)?.invoices?.find(x=>x.id===invoiceId);if(!invoice?.approved||invoice.paid){notify('Setujui penawaran sebelum membayar.');return}updateOrder(oid,x=>{let inv=x.invoices.find(y=>y.id===invoiceId);inv.paid=true;x.messages.push({from:'customer',text:`Pembayaran simulasi untuk invoice ${inv.id} selesai.`,at:Date.now()})});render();notify('Invoice khusus ditandai lunas (simulasi).')}});
document.addEventListener('submit',e=>{if(e.target.id==='login-form'){e.preventDefault();let d=new FormData(e.target),name=d.get('name')?.trim(),email=d.get('email')?.trim().toLowerCase();if(!name||!email)return;localStorage.setItem(KEY_USER,JSON.stringify({name,email}));let dest=sessionStorage.getItem('temukost_after_login')||'home';sessionStorage.removeItem('temukost_after_login');go(dest);notify('Akun demo siap di browser ini.');return}if(e.target.id==='booking-form'){e.preventDefault();let form=e.target;if(step===1&&!form.reportValidity())return;collectStep(form);if(step<3){step++;render()}else go('package');return}if(e.target.id==='invoice-form'){e.preventDefault();let f=new FormData(e.target),o=orderById(staffSelected);if(!o)return;let invoice={id:'ADD-'+Date.now().toString(36).toUpperCase(),title:f.get('title').trim(),amount:Number(f.get('amount')),note:f.get('note').trim(),approved:false,paid:false,created:Date.now()};updateOrder(o.id,x=>{x.invoices.push(invoice);x.messages.push({from:'team',text:`Kami menyiapkan penawaran tambahan khusus: “${invoice.title}” senilai ${money(invoice.amount)}. Lihat detailnya di akunmu.`,at:Date.now()})});render();notify('Invoice khusus terbit untuk akun pelanggan.');return}if(e.target.matches('.chat-send')){e.preventDefault();sendChat(e.target)}});
window.addEventListener('storage',()=>render());render();
</script>
